<defs>
    <filter id="recorte" x="-15%" y="-15%" width="130%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="1" seed="5" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="3.3" xChannelSelector="R" yChannelSelector="G" result="borda"/>
      <feDropShadow in="borda" dx="0" dy="3" stdDeviation="2.4" flood-color="#3A1222" flood-opacity="0.3"/>
    </filter>
